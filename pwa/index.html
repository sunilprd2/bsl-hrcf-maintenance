<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07599c"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>BSL (HRCF) Maintenance Log</title></head><body>
<div id="loginView" class="login-wrap"><div class="login-card"><div class="logo">BSL</div><h1>BSL</h1><p class="sub">Maintenance Log System</p><div class="field"><label>Staff No</label><input id="staffNo" class="input" inputmode="numeric" maxlength="6" placeholder="6 digit Staff No"></div><div class="field"><label>Password</label><input id="password" class="input" type="password" placeholder="Password"></div><button id="loginBtn" class="btn primary full">Login</button><div id="loginMsg" class="muted" style="text-align:center;margin-top:12px"></div></div></div>
<div id="appView" class="app hidden"><header class="topbar"><button class="iconbtn" onclick="openDrawer()">☰</button><div class="brand">BSL<small>Maintenance Log System</small></div><button class="iconbtn" onclick="showSync()">🔔</button></header><div id="net" class="statusbar online">Online</div><main id="main" class="page"></main></div>
<div id="drawer" class="drawer hidden" onclick="closeDrawer(event)"><div class="drawer-panel" onclick="event.stopPropagation()"><div class="drawer-head">BSL Maintenance</div><div id="userMini" class="muted" style="margin-bottom:15px"></div><div class="nav"><button onclick="home()">🏠 Home</button><button onclick="newEntry()">📝 New Entry</button><button onclick="reports()">📋 View Reports</button><button onclick="equipmentPage()">⚙ Equipment</button><button onclick="showSync()">🔄 Pending Sync</button><button onclick="logout()">🚪 Logout</button></div></div></div><div id="toast" class="toast hidden"></div>
<script src="./config.js"></script><script src="./app.js"></script></body></html>
