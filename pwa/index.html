<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07599c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<title>BSL HRCF SANRAKSH</title>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <img class="login-logo-img" src="./icon-192.png" alt="BSL HRCF SANRAKSH">
    <h1>BSL</h1>
    <div class="login-name">Maintenance Log System</div>
    <div class="login-subtitle">HRCF • SANRAKSH</div>
    <div class="field"><label>Staff No</label><div class="input-icon"><span>👤</span><input id="staffNo" class="input" inputmode="numeric" maxlength="6" placeholder="User ID / Number"></div></div>
    <div class="field"><label>Password</label><div class="input-icon"><span>🔒</span><input id="password" class="input" type="password" placeholder="Password"></div></div>
    <button id="loginBtn" class="btn primary full login-btn">Login</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <button class="iconbtn" onclick="openDrawer()" aria-label="Menu">☰</button>
    <div id="topTitle" class="brand">BSL<small>Maintenance Log System</small></div>
    <button id="topRight" class="iconbtn" onclick="showSync()" aria-label="Notifications">🔔</button>
  </header>
  <div id="net" class="statusbar online">🟢 Online</div>
  <main id="main" class="page"></main>
</div>

<div id="drawer" class="drawer hidden" onclick="closeDrawer(event)">
  <div class="drawer-panel" onclick="event.stopPropagation()">
    <div class="drawer-brand"><img src="./icon-192.png" alt="BSL"><div><b>BSL</b><span>Maintenance Log</span></div></div>
    <div id="userMini" class="drawer-user"></div>
    <div class="nav">
      <button onclick="home()">⌂ <span>Home</span></button>
      <button onclick="newEntry()">▣ <span>New Entry</span></button>
      <button onclick="reports()">▤ <span>View Reports</span></button>
      <button onclick="equipmentPage()">⚙ <span>Equipment Master</span></button>
      <button onclick="showSync()">↻ <span>Pending Sync</span></button>
      <button onclick="dashboard()">▥ <span>Dashboard</span></button>
      <button onclick="logout()">⇥ <span>Logout</span></button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="./config.js"></script><script src="./app.js"></script>
</body>
</html>
